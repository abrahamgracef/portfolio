name: Auto Remove cass.pdf

on:
  schedule:
    - cron: '50 13 4 9 *'  # 7:20 PM IST (13:50 UTC), Sep 4 only
  workflow_dispatch:

jobs:
  remove-file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -f public/cass.pdf
          git add public/cass.pdf
          git diff --staged --quiet || git commit -m "Auto-removed cass.pdf" && git push
